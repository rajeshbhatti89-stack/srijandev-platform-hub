name: SrijanDev Next CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'apps/srijandev-next/package-lock.json'

      - name: Install Dependencies
        run: npm --prefix apps/srijandev-next install --legacy-peer-deps

      - name: Type Check
        run: ./apps/srijandev-next/node_modules/.bin/tsc -p apps/srijandev-next/tsconfig.json --noEmit

      - name: Next.js Production Build
        run: npm --prefix apps/srijandev-next run build
